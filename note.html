<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note - BJOAND</title>
    <!-- Local Offline Icons -->
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="note.css">
</head>
<body>

    <div class="note-wrapper">
        <div class="note-card" id="noteCard">
            
            <!-- Header Bar -->
            <header class="note-header">
                <div class="header-left">
                    <span class="note-icon" title="Quick Note">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5zM16 8L2 22M17.5 15H9"/>
                        </svg>
                    </span>
                    <span class="note-title">QUICK NOTE</span>
                    <span class="shortcut-badge">Alt + N</span>
                </div>
                
                <div class="header-actions">
                    <button class="icon-btn" id="copyNoteBtn" title="Salin Catatan (Ctrl+Shift+C)">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button class="icon-btn" id="clearNoteBtn" title="Kosongkan Catatan">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                    <button class="icon-btn close-btn" id="closeNoteBtn" title="Tutup (Esc / Alt+N)">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Text Area Body -->
            <main class="note-body">
                <div class="editor-container">
                    <textarea 
                        id="noteTextarea" 
                        placeholder="Ketik catatan cepat di sini...&#10;&#10;• Otomatis tersimpan secara instan&#10;• Tekan Esc atau Alt+N untuk menutup&#10;• Kontras tinggi & ramah di mata" 
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"></textarea>
                </div>
                
                <!-- Toast Feedback for Copy -->
                <div class="copy-feedback" id="copyFeedback">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 5px;">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Tersalin ke Clipboard!
                </div>
            </main>

            <!-- Footer Status Bar -->
            <footer class="note-footer">
                <div class="save-indicator" id="saveIndicator">
                    <span class="status-dot"></span>
                    <span id="saveStatusText">Tersimpan</span>
                </div>
                <div class="note-stats" id="noteStats">
                    0 kata • 0 karakter
                </div>
            </footer>

        </div>
    </div>

    <script src="note.js"></script>
</body>
</html>
